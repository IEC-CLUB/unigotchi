<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B5CFF">
<meta property="og:title" content="IEC Unigotchi">
<meta property="og:description" content="Raise an IEC unicorn from Member to Executive in 3 minutes.">
</head>
<body>
<title>IEC Unigotchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: one phone column. Egg device on top, task chips under it; signature games open full-screen; short text in a bottom sheet.
   UI tokens below are the single place to restyle colors and fonts. */
:root{
  --page:#F3E9FF; --page-dot:#FFFFFF; --ink:#2E2357; --ink-soft:#6A5F8F;
  --shell-shade:#E6E0F0; --btn:#E9CFA6; --btn-shade:#C9A97A;
  --tint:#7B5CFF; --tint2:#3BD1C6; --tint-soft:#E9E3FF; --paper:#FFF8EE; --good:#1E9E6A; --bad:#D64563;
  --f-pixel:"Pixelify Sans", ui-monospace, monospace;
  --f-body:"M PLUS Rounded 1c", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;
  background-image:radial-gradient(var(--page-dot) 1.5px,transparent 1.6px),radial-gradient(var(--page-dot) 1px,transparent 1.2px);
  background-size:34px 34px,22px 22px;background-position:0 0,11px 17px;transition:background-color .4s;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit}
.app{max-width:440px;margin:0 auto;padding:10px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:100%}
.top{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand{font-family:var(--f-pixel);font-weight:700;font-size:20px;letter-spacing:.04em}
.brand small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.hdr-r{display:flex;gap:8px;align-items:center}
.snd{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:16px;cursor:pointer;line-height:1}
.dept-chip{font-family:var(--f-pixel);font-size:13px;background:var(--tint);color:#fff;padding:4px 10px;border-radius:999px;white-space:nowrap}

/* Egg device */
.egg{position:relative;width:min(86vw,350px);aspect-ratio:1/1.13;border-radius:50% 50% 47% 47% / 58% 58% 42% 42%;
  background:radial-gradient(circle at 35% 25%,#fff 0 30%,var(--shell-shade) 95%);
  box-shadow:inset -10px -16px 30px rgba(46,35,87,.12),0 14px 30px rgba(46,35,87,.18);display:flex;flex-direction:column;align-items:center}
.egg::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background-image:radial-gradient(rgba(46,35,87,.16) 2.2px,transparent 2.6px);background-size:46px 40px;background-position:12px 8px;opacity:.6}
.egg-title{margin-top:9%;font-family:var(--f-pixel);font-weight:700;font-size:clamp(22px,7vw,28px);letter-spacing:.06em;color:#fff;
  -webkit-text-stroke:2px #8E86A3;paint-order:stroke fill;text-shadow:0 3px 0 #8E86A3;z-index:1}
.frame{position:relative;margin-top:3%;width:80%;aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(160deg,var(--tint2),var(--tint));
  clip-path:polygon(50% 0,60% 7%,74% 3%,80% 14%,96% 16%,93% 30%,100% 42%,93% 54%,98% 70%,86% 78%,82% 93%,66% 90%,50% 100%,34% 90%,18% 93%,14% 78%,2% 70%,7% 54%,0 42%,7% 30%,4% 16%,20% 14%,26% 3%,40% 7%)}
.screen{position:relative;width:76%;aspect-ratio:1;border:6px solid #8E86A3;border-radius:12px;overflow:hidden;background:#fff}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:pointer;touch-action:none}
.btns{position:absolute;bottom:5%;left:0;right:0;display:flex;justify-content:center;gap:9%;align-items:flex-start}
.btns button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;font:700 10px var(--f-body);color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.btns button span.b{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F6E4C6,var(--btn) 55%,var(--btn-shade));box-shadow:0 3px 0 #B49364,inset 0 -3px 6px rgba(0,0,0,.08);display:block}
.btns button:nth-child(2){margin-top:12px}
.btns button:active span.b{transform:translateY(2px);box-shadow:0 1px 0 #B49364}

.hud{position:absolute;top:4px;left:4px;right:4px;display:flex;gap:4px;pointer-events:none}
.hud div{flex:1;background:rgba(255,255,255,.88);border-radius:5px;padding:2px 4px;font:700 8.5px var(--f-pixel);letter-spacing:.04em;color:var(--ink)}
.hud i{display:block;height:4px;border-radius:2px;background:#E6E0F0;margin-top:1px;overflow:hidden}
.hud i b{display:block;height:100%;background:var(--tint);transition:width .5s}
.bubble{position:absolute;width:20%;aspect-ratio:1.15;background:#fff;border:2px solid var(--ink);border-radius:46%;display:grid;place-items:center;transform:translate(-50%,-100%);pointer-events:none}
.bubble::after{content:"";position:absolute;bottom:-7px;left:42%;width:7px;height:7px;background:#fff;border:2px solid var(--ink);border-radius:50%}
.bubble svg{width:58%;height:58%;fill:var(--tint)}
.feedbar{width:100%;display:flex;flex-direction:column;gap:5px;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:8px 12px;font:700 15px var(--f-body);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);text-align:left}
.feedbar>span{display:flex;justify-content:space-between;align-items:center;gap:8px}
.feedbar em{font:700 20px var(--f-pixel);font-style:normal;font-variant-numeric:tabular-nums}
.feedbar i{display:block;height:10px;border-radius:5px;background:#E6E0F0;overflow:hidden}
.feedbar i b{display:block;height:100%;background:var(--good);transition:width 1s linear}
.feedbar.warn{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:shake .5s ease-in-out infinite}
.feedbar.warn i b{background:var(--bad)}.feedbar.warn em{color:var(--bad)}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.stage-head .hg{font:700 14px var(--f-pixel);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stage-head .hg.warn{color:var(--bad)}
.msgslot{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;margin-top:-4px}
.toast{background:var(--ink);color:#fff;font:700 13.5px/1.35 var(--f-body);padding:9px 14px;border-radius:12px;text-align:center;pointer-events:none;animation:pop .25s ease-out;max-width:100%;text-wrap:balance}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.food{position:absolute;font-size:clamp(22px,8vw,32px);transform:translate(-50%,-50%);animation:chomp 1.8s steps(4) forwards;pointer-events:none}
@keyframes chomp{100%{clip-path:inset(0 0 0 100%);opacity:.2}}
.layer{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;background-image:repeating-linear-gradient(135deg,rgba(255,170,200,.25) 0 10px,transparent 10px 20px)}
.layer-head{background:var(--tint);color:#fff;font:700 13px var(--f-pixel);letter-spacing:.06em;padding:7px 8px;display:flex;align-items:center;gap:6px}
.layer-head button{background:none;border:0;color:#fff;font:700 14px var(--f-pixel);cursor:pointer;padding:0 4px}
.list{flex:1;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:5px}
.li{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#FFF4E2;border:2px solid #F7B267;border-radius:10px;padding:6px 8px;font:600 13px/1.2 var(--f-body);color:#B85A00;cursor:pointer;box-shadow:0 2px 0 #F7B267}
.li:active{transform:translateY(1px);box-shadow:none}
.li small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:500}
.li .dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.li .ck{margin-left:auto;font:700 10px var(--f-pixel);color:var(--good);text-align:right}
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;align-content:center}
.ic{aspect-ratio:1;border-radius:50%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:#fff;font:700 9px var(--f-pixel);letter-spacing:.05em;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.ic svg{width:44%;height:44%;fill:#fff}
.ic.done{outline:3px solid var(--good);outline-offset:-3px}
.tapper{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px}
.tapper .num{font:700 30px var(--f-pixel);font-variant-numeric:tabular-nums}
.tapper .unit{font:600 11px var(--f-body);color:var(--ink-soft)}
.tapbtn{width:46%;aspect-ratio:1;border-radius:50%;border:0;background:var(--tint);color:#fff;font:700 18px var(--f-pixel);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.tapbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}

.tasks{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.task{display:flex;align-items:center;gap:7px;min-height:46px;padding:6px 9px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;font:700 13px var(--f-body);text-align:left;box-shadow:0 3px 0 var(--ink)}
.task svg{width:20px;height:20px;flex:none;fill:var(--tint)}
.task.done{background:var(--tint-soft);box-shadow:0 3px 0 var(--tint);border-color:var(--tint)}
.task.done::after{content:"✓";margin-left:auto;font-family:var(--f-pixel);color:var(--tint)}
.task.next{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.task:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--tint2);outline-offset:2px}
.hint{width:100%;text-align:center;font-size:13px;font-weight:600;color:var(--ink-soft);min-height:1.4em;text-wrap:balance}
.intro{width:100%;text-align:center;font-size:14px;line-height:1.5;text-wrap:balance}
.intro b{color:var(--tint)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(46,35,87,.35);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{width:100%;max-width:440px;max-height:80%;overflow:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(46,35,87,.25);animation:up .28s ease-out;border-top:5px solid var(--tint)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.eyebrow{font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--tint)}
.sheet h2{margin:4px 0 8px;font:700 21px/1.2 var(--f-pixel);text-wrap:balance}
.sheet p{margin:0 0 10px;line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.opt{padding:10px 6px;border-radius:14px;border:2px solid var(--ink);background:#fff;font:700 12.5px/1.25 var(--f-body);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.opt span{font-size:28px;line-height:1}
.opt.right{border-color:var(--good);background:#DDF5EA;box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:#FCE1E7;box-shadow:0 3px 0 var(--bad);opacity:.7}
.fb{padding:10px 12px;border-radius:12px;background:#fff;border-left:4px solid var(--good);font-size:14px;line-height:1.45;margin-bottom:10px}
.fb.no{border-left-color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.primary{flex:1;min-height:48px;border:0;border-radius:14px;background:var(--tint);color:#fff;font:700 16px var(--f-pixel);letter-spacing:.05em;cursor:pointer;box-shadow:0 4px 0 var(--ink);text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;padding:0 14px}
.secondary{flex:1;min-height:48px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);font:700 14px var(--f-body);cursor:pointer;box-shadow:0 4px 0 var(--ink);padding:0 10px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.primary:active,.secondary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}
.meta{font-size:12.5px;color:var(--ink-soft);margin-top:12px;line-height:1.5}
.exec{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--ink);margin:8px 0 6px}
.exec .ph{width:84px;height:84px;flex:none;border-radius:50%;border:3px solid var(--tint);background:var(--tint-soft) center/cover no-repeat;display:grid;place-items:center;overflow:hidden}
.exec .ph canvas{width:76px;height:76px;image-rendering:pixelated}
.exec b{display:block;font:700 17px/1.2 var(--f-pixel)}
.exec small{display:block;font-weight:700;color:var(--tint);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:2px 0 4px}
.exec p{margin:0;font-size:13.5px;line-height:1.4}
.evo-row{display:flex;justify-content:space-between;gap:6px;margin:6px 0 4px}
.evo-row div{flex:1;text-align:center;font:700 10.5px var(--f-body);color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.evo-row canvas{width:100%;max-width:72px;aspect-ratio:1;image-rendering:pixelated;display:block;margin:0 auto 2px}
.evo-row div.on{color:var(--tint)}

/* full-screen game stage */
.stage{position:fixed;inset:0;z-index:30;background:var(--page);display:flex;justify-content:center}
.stage-in{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);gap:10px}
.stage-head{display:flex;align-items:center;gap:10px}
.stage-head b{font:700 20px var(--f-pixel);flex:1}
.stage-head .tm{font:700 18px var(--f-pixel);font-variant-numeric:tabular-nums;color:var(--tint)}
.stage-head .x{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:#fff;font:700 16px var(--f-pixel);cursor:pointer;color:var(--ink)}
.stage-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto}
.how{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:1;text-align:center}
.how .icons{font-size:40px;letter-spacing:8px}
.how p{margin:0;font-weight:700;font-size:16px;line-height:1.4;max-width:30ch}
.go{background:var(--tint);color:#fff;border:0;border-radius:999px;padding:12px 30px;font:700 18px var(--f-pixel);letter-spacing:.06em;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.gcv{width:100%;max-height:100%;aspect-ratio:3/4;object-fit:contain;border-radius:16px;border:3px solid var(--ink);touch-action:none;display:block;margin:0 auto;background:#fff;max-width:100%}
.gmode{text-align:center;font-weight:700;font-size:13px;color:var(--ink-soft)}
.result{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;flex:1;text-align:center}
.result .big{font:700 44px var(--f-pixel);color:var(--tint)}
.result p{margin:0;font-weight:700;font-size:16px}

/* EA swipe */
.ev{background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-weight:700;text-align:center}
.deck{position:relative;flex:1;min-height:280px}
.pcard{position:absolute;inset:6px 10px;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;touch-action:none;user-select:none;cursor:grab}
.pcard.back{transform:scale(.94) translateY(10px);opacity:.6}
.pcard .skill{display:flex;align-items:center;gap:10px;background:var(--tint);color:#fff;font:700 24px/1.1 var(--f-pixel);padding:12px 16px;border-radius:16px;width:100%;justify-content:center;text-align:left;box-shadow:0 4px 0 var(--ink)}
.pcard .skill>span{font-size:34px}
.pcard .skill small{display:block;font:800 11px var(--f-body);letter-spacing:.14em;opacity:.85;color:#fff}
.pcard .by{font-style:normal;font-weight:700;font-size:12px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.pcard .em{font-size:44px;line-height:1}
.pcard b{font:700 17px/1.2 var(--f-body)}
.pcard small{font-size:14px;font-weight:600;color:var(--ink-soft)}
.pcard .stamp{position:absolute;top:18px;font:700 22px var(--f-pixel);padding:4px 10px;border:3px solid;border-radius:10px;opacity:0}
.pcard .stamp.y{right:18px;color:var(--good);transform:rotate(12deg)}
.pcard .stamp.n{left:18px;color:var(--bad);transform:rotate(-12deg)}
.swipe-btns{display:flex;gap:12px}
.sb{flex:1;min-height:56px;border-radius:16px;border:3px solid var(--ink);font:700 18px var(--f-pixel);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.sb.no{background:#FCE1E7;color:var(--bad)} .sb.yes{background:#DDF5EA;color:var(--good)}
.sw-fb{min-height:1.4em;text-align:center;font-weight:700}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{position:relative;border:2px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:700 13px/1.2 var(--f-body);color:var(--ink);text-align:center}
.tile span.e{font-size:30px;line-height:1}
.tile .pr{font:700 12px var(--f-pixel);color:var(--tint)}
.tile.on{background:var(--tint-soft);border-color:var(--tint);box-shadow:0 3px 0 var(--tint)}
.tile:disabled{opacity:.4;cursor:default}
.tile .cnt{position:absolute;top:4px;right:6px;font:700 11px var(--f-pixel);background:var(--tint);color:#fff;border-radius:999px;padding:1px 6px}
.tile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.q{font:700 18px/1.25 var(--f-pixel);text-align:center;margin:4px 0}
.cut{width:100%;aspect-ratio:300/220;border-radius:16px;border:3px solid var(--ink);image-rendering:pixelated;display:block}
.lobby-n{text-align:center;font-size:15px;font-weight:600}
.lobby-n b{color:var(--tint)}
.cap{text-align:center;font:700 16px var(--f-pixel)}

/* F&L frame */
.receipt{background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;font:700 13px var(--f-body);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.receipt .left{color:var(--good)} .receipt .left.low{color:var(--bad)}
.bbar{height:8px;border-radius:4px;background:#E6E0F0;overflow:hidden;margin-top:-4px}
.bbar b{display:block;height:100%;background:var(--tint);transition:width .3s}
.fpre{width:min(62vw,240px);aspect-ratio:1;display:block;margin:0 auto;border-radius:12px}
.steps{display:flex;justify-content:center;gap:6px}
.steps i{width:28px;height:6px;border-radius:3px;background:#D9D2EA}
.steps i.on{background:var(--tint)}
.lines{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums}
.lines li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #CFC6E2;font-weight:600}
.lines li:last-child{border:0;font-weight:800}

/* doodle */
.dcv{width:100%;max-width:340px;aspect-ratio:1;display:block;margin:0 auto;background:#fff;border:3px solid var(--ink);border-radius:16px;touch-action:none}
.prompt{background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;text-align:center}
.prompt small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:700}
.prompt b{font:700 19px/1.25 var(--f-pixel)}
.pal{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.pal button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink);cursor:pointer}
.pal button.on{box-shadow:0 0 0 3px var(--tint2)}
.pal .tool{width:auto;border-radius:10px;padding:0 10px;background:#fff;font:700 13px var(--f-body);color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.gin{width:100%;min-height:50px;border:2px solid var(--ink);border-radius:14px;padding:0 14px;font:700 17px var(--f-body);color:var(--ink);background:#fff}
.chain{display:flex;flex-direction:column;gap:8px}
.chain .it{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px}
.chain .it.me{border-color:var(--tint);background:var(--tint-soft)}
.chain .it canvas{width:96px;height:96px;flex:none;border:1px solid #DDD;border-radius:8px}
.chain .it small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.chain .it b{font:700 16px/1.25 var(--f-pixel)}

/* gallery */
.tabs{display:flex;gap:8px;margin:6px 0 10px}
.tabs button{flex:1;min-height:40px;border-radius:12px;border:2px solid var(--ink);background:#fff;font:700 14px var(--f-body);cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gal figure{margin:0;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px}
.gal img{width:100%;aspect-ratio:1;border-radius:10px;display:block;object-fit:cover}
.gal figcaption{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}
.vote{border:2px solid var(--bad);color:var(--bad);background:#fff;border-radius:999px;padding:4px 10px;font:700 12px var(--f-body);cursor:pointer}
.vote.on{background:var(--bad);color:#fff}
.vote:disabled{opacity:.4;cursor:default}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.strip>*{flex:none}
.strip canvas{width:80px;height:80px;border:1px solid #DDD;border-radius:8px;background:#fff}
.strip .tx{width:110px;min-height:80px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:6px;font:700 12px/1.3 var(--f-body);display:flex;align-items:center}
.dch{background:#fff8;border-radius:12px;padding:8px;margin-bottom:8px}

let frame=0,last=0;

  if(S.stage===2||T.evo){ctx.fillStyle='#FFD54A';for(let i=0;i<5;i++){const a=frame*.5+i*1.26;ctx.fillRect(Math.round(T.ux+Math.cos(a)*20),Math.round(72+Math.sin(a)*14),1,1)}}
  if(T.anim&&T.anim.k==='bath'&&T.anim.f<18)drawCloud(Math.round(T.ux),40);

 }

  if(Math.abs(T.ux-T.ut)<1){if(Math.random()<.05)T.ut=24+Math.random()*48}else{const dir=Math.sign(T.ut-T.ux);T.ux+=dir;T.face=dir}
 }
 const a=T.anim;
 if(a&&a.k==='bath'){a.f++;
  if(a.f<18)for(let i=0;i<2;i++)T.parts.push({k:'drop',x:T.ux-11+Math.random()*24,y:46,vx:0,vy:3,life:8});
  if(a.f===16){S.poop=false;save()}

 if(T.moodUntil&&Date.now()>T.moodUntil){T.mood=null;T.moodUntil=0}

 else if(S.phase==='done')setTimeout(finale,400);

 function run(){
  body.innerHTML=`<canvas class="gcv" id="gc" width="300" height="400"></canvas><div class="gmode" id="gm">Drag to move the cloud</div>`;
  const c=$('#gc'),g=c.getContext('2d');
  const CY=150;let cx=150,target=null,tilt=null,stun=0,plants=[60,150,240].map(x=>({x,w:0})),falls=[],drops=[],t0=performance.now(),prev=t0,lastFall=0,raf,ended=false,flashTxt=0;
  const onOri=e=>{if(e.gamma!=null){tilt=e.gamma;$('#gm')&&($('#gm').textContent='Tilt mode on · drag also works')}};
  window.addEventListener('deviceorientation',onOri);

  c.addEventListener('pointerdown',e=>{target=toX(e);try{c.setPointerCapture(e.pointerId)}catch(_){}});

    plants.forEach(p=>{if(p.w<1&&Math.abs(p.x-cx)<38)p.w=Math.min(1,p.w+dt*.3)})}

   if(el-lastFall>Math.max(.65,1.2-el*.02)){lastFall=el;falls.push({x:30+Math.random()*240,y:-20,v:105+el*3,e:rand(['🐇','🌀','📱'])})}
   falls=falls.filter(f=>{f.y+=f.v*dt;if(!stun&&Math.abs(f.x-cx)<38&&Math.abs(f.y-CY)<22){stun=1.3;flashTxt=1;return false}return f.y<420});
   drops=drops.filter(r=>{r.y+=380*dt;return r.y<318});
   // draw
   const sky=g.createLinearGradient(0,0,0,400);sky.addColorStop(0,d.wall);sky.addColorStop(1,'#fff');g.fillStyle=sky;g.fillRect(0,0,300,400);
   g.fillStyle=d.floor;g.fillRect(0,320,300,80);g.fillStyle=d.floor2;for(let x=0;x<300;x+=14)g.fillRect(x,332+(x%28?6:0),8,4);
   g.strokeStyle='#4FA3FF';g.lineWidth=2;drops.forEach(r=>{g.beginPath();g.moveTo(r.x,r.y);g.lineTo(r.x,r.y+8);g.stroke()});
   plants.forEach(p=>{
    const h=14+p.w*88,top=320-h;g.strokeStyle='#2E8B57';g.lineWidth=5;g.beginPath();g.moveTo(p.x,320);g.lineTo(p.x,top);g.stroke();
    if(p.w>.3){g.fillStyle='#3BB273';g.beginPath();g.ellipse(p.x-13,320-h*.45,12,6,-.5,0,7);g.fill();g.beginPath();g.ellipse(p.x+13,320-h*.62,12,6,.5,0,7);g.fill()}
    if(p.w>=1){g.fillStyle='rgba(255,230,80,.35)';g.beginPath();g.arc(p.x,top-16,30+Math.sin(el*6)*3,0,7);g.fill();g.font='40px serif';g.textAlign='center';g.textBaseline='middle';g.fillText('💡',p.x,top-16)}
    else{g.fillStyle=d.pal.m1;g.beginPath();g.arc(p.x,top-6,5+p.w*9,0,7);g.fill()}
    g.fillStyle='#fff';g.fillRect(p.x-24,348,48,8);g.fillStyle=p.w>=1?'#F4C542':d.tint;g.fillRect(p.x-24,348,48*p.w,8);g.strokeStyle=d.pal.ol;g.lineWidth=2;g.strokeRect(p.x-24,348,48,8);
   });
   g.font='30px serif';g.textAlign='center';g.textBaseline='middle';falls.forEach(f=>g.fillText(f.e,f.x,f.y));
   const cc=stun?'#9AA3B5':'#fff';g.fillStyle=cc;g.strokeStyle=d.pal.ol;g.lineWidth=3;
   [[-26,8,20],[0,0,28],[26,8,20]].forEach(([dx,dy,r])=>{g.beginPath();g.arc(cx+dx,CY+dy,r,0,7);g.fill();g.stroke()});
   g.fillRect(cx-44,CY,88,22);g.beginPath();g.moveTo(cx-46,CY+22);g.lineTo(cx+46,CY+22);g.stroke();
   g.fillStyle=d.pal.ol;g.fillRect(cx-10,CY-4,4,4);g.fillRect(cx+6,CY-4,4,4);

  $('#sz').onclick=()=>{w=w===6?14:6;$('#sz').textContent=w===6?'Thick':'Thin'};
  $('#un').onclick=()=>{strokes.pop();redraw()};
  const iv=setInterval(()=>{tLeft--;$('#dt')&&($('#dt').textContent=`· ${tLeft}s`);if(tLeft<=0)send()},1000);stageCleanup=()=>clearInterval(iv);
  let sent=false;
  async function send(){if(sent)return;if(!strokes.length&&tLeft>0){toast('Draw something first!');return}sent=true;clearInterval(iv);$('#dd').disabled=true;
   try{await Store.append(chainB,{t:'d',v:JSON.stringify(strokes),by:devId()})}catch(e){}
   reveal()}
  $('#dd').onclick=send;
 }
 async function reveal(){
  $('#stT').textContent='';
  let ch=chainA;try{ch=await Store.getChain(chainA.id)||chainA}catch(e){}
  body.innerHTML=`<div class="q">The chain so far 🎞️</div><div class="chain" id="ch"></div><div class="row"><button class="primary" id="fin">Finish shift</button></div>`;
  const el=$('#ch'),me=devId();
  ch.entries.forEach(e=>{const it=document.createElement('div');it.className='it'+(e.by===me?' me':'');
   if(e.t==='d'){const cc=document.createElement('canvas');cc.width=cc.height=192;renderStrokes(cc,JSON.parse(e.v));it.appendChild(cc);it.insertAdjacentHTML('beforeend',`<div><small>${e.by===me?'You drew':'Someone drew'}</small></div>`)}
   else it.innerHTML=`<div><small>${e.t==='p'?'Prompt':e.by===me?'Your guess':'Guess'}</small><b>${esc(e.v)}</b></div>`;
   el.appendChild(it)});
  $('#fin').onclick=finishWork;
 }
}

/* =====================================================================
   STORE: Firebase if configured, otherwise this phone only
   ===================================================================== */
const CHAIN_MAX=8;
const Store={
 mode:'local',db:null,
 async init(){
  if(!CONFIG.firebase||!CONFIG.firebase.apiKey)return;
  try{const v='10.12.2';await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
   firebase.initializeApp(CONFIG.firebase);this.db=firebase.firestore();this.mode='online'}catch(e){console.warn('Firebase off, local mode',e)}
 },
 ts(){return this.mode==='online'?firebase.firestore.FieldValue.serverTimestamp():Date.now()},
 local(k,seed){let v=lsGet(k,null);if(!v){v=seed();lsSet(k,v)}return v},
 async chains(){
  if(this.mode==='online'){const q=await this.db.collection('chains').orderBy('updatedAt','desc').limit(30).get();return q.docs.map(x=>Object.assign({id:x.id},x.data()))}
  return this.local('ug-chains',()=>[]).slice().reverse();
 },
 async getChain(id){
  if(this.mode==='online'){const x=await this.db.collection('chains').doc(id).get();return x.exists?Object.assign({id},x.data()):null}
  return lsGet('ug-chains',[]).find(c=>c.id===id)||null;
 },
 async createChain(entries){
  if(this.mode==='online'){try{const ref=await this.db.collection('chains').add({entries,done:false,updatedAt:this.ts()});return{id:ref.id,entries}}catch(e){console.warn(e)}}
  const all=lsGet('ug-chains',[]),c={id:'l'+Date.now()+Math.random().toString(36).slice(2,6),entries,done:false};all.push(c);lsSet('ug-chains',all.slice(-40));return c;
 },
 async append(chain,entry){
  if(this.mode==='online'&&!String(chain.id).startsWith('l')){
   const ref=this.db.collection('chains').doc(chain.id);let out=null;
   try{await this.db.runTransaction(async tx=>{const s=await tx.get(ref);const en=(s.data().entries||[]).concat([entry]);out={id:chain.id,entries:en};tx.update(ref,{entries:en,done:en.length>=CHAIN_MAX,updatedAt:this.ts()})});return out}
   catch(e){console.warn(e);return this.createChain(entry.t==='g'?[{t:'p',v:entry.v,by:entry.by}]:[{t:'p',v:chain.entries[chain.entries.length-1].v,by:'seed'},entry])}
  }
  const all=lsGet('ug-chains',[]);let c=all.find(x=>x.id===chain.id);if(!c){c={id:chain.id,entries:chain.entries.slice(),done:false};all.push(c)}
  c.entries.push(entry);c.done=c.entries.length>=CHAIN_MAX;lsSet('ug-chains',all.slice(-40));return Object.assign({},c);
 },
 async hangPick(key){
  if(this.mode==='online'){await this.db.collection('hangout').doc(key).set({n:firebase.firestore.FieldValue.increment(1)},{merge:true});return}
  const h=lsGet('ug-hang',{});h[key]=(h[key]||0)+1;lsSet('ug-hang',h);
 },
 async hangCount(key){
  if(this.mode==='online'){const x=await this.db.collection('hangout').doc(key).get();return x.exists?(x.data().n||0):0}
  return lsGet('ug-hang',{})[key]||0;
 },
 async frames(){
  if(this.mode==='online'){const q=await this.db.collection('frames').orderBy('votes','desc').limit(40).get();return q.docs.map(x=>Object.assign({id:x.id},x.data()))}
  return lsGet('ug-frames',[]).slice().sort((a,b)=>b.votes-a.votes);
 },
 async addFrame(f){
  const doc={img:f.img,spent:f.spent,shape:f.shape,votes:0,by:devId(),createdAt:this.ts()};
  if(this.mode==='online'){const r=await this.db.collection('frames').add(doc);lsSet('ug-myframe',r.id);return}
  const all=lsGet('ug-frames',[]);const id='l'+Date.now();all.push(Object.assign({id},doc));lsSet('ug-frames',all.slice(-20));lsSet('ug-myframe',id);
 },
 async vote(id){
  if(this.mode==='online'){await this.db.collection('frames').doc(id).update({votes:firebase.firestore.FieldValue.increment(1)});return}
  const all=lsGet('ug-frames',[]),f=all.find(x=>x.id===id);if(f)f.votes++;lsSet('ug-frames',all);
 }
};
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);setTimeout(()=>no(new Error('timeout')),8000)})}

/* ---------- gallery (right button) ---------- */
async function openGallery(tab='frames'){
 openSheet(`<div class="eyebrow">IEC gallery · ${Store.mode==='online'?'live':'this phone only'}</div><h2>Made by players</h2>
  <div class="tabs"><button data-t="frames" class="${tab==='frames'?'on':''}">🖼️ Frames</button><button data-t="doodles" class="${tab==='doodles'?'on':''}">✏️ Doodles</button></div><div id="gb"><p>Loading...</p></div>
  <div class="row"><button class="secondary" id="gx">Close</button></div>`);
 sheet.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>openGallery(b.dataset.t));$('#gx').onclick=closeSheet;
 const gb=$('#gb');
 try{
  if(tab==='frames'){
   const fr=await Store.frames(),voted=lsGet('ug-voted',null),mine=lsGet('ug-myframe',null);
   if(!fr.length){gb.innerHTML='<p>No frames yet. Raise the F&L unicorn and build the first one!</p>';return}
   gb.innerHTML=`<p class="meta" style="margin-top:0">1 vote per player. Top frame wins at the booth!</p><div class="gal">${fr.map((f,i)=>`<figure><img src="${esc(f.img)}" alt="Frame ${i+1}"><figcaption><span>${i===0?'👑 ':''}♥ ${f.votes}</span>${f.id===mine?'<small>yours</small>':`<button class="vote ${voted===f.id?'on':''}" data-id="${esc(f.id)}" ${voted?'disabled':''}>${voted===f.id?'Voted':'Vote'}</button>`}</figcaption></figure>`).join('')}</div>`;
   gb.querySelectorAll('.vote').forEach(b=>b.onclick=async()=>{if(lsGet('ug-voted',null))return;lsSet('ug-voted',b.dataset.id);try{await Store.vote(b.dataset.id)}catch(e){}openGallery('frames')});
  }else{
   const ch=(await Store.chains()).filter(c=>c.entries&&c.entries.length>1).slice(0,8);
   if(!ch.length){gb.innerHTML='<p>No doodle chains yet. Raise the Media unicorn to start one!</p>';return}
   gb.innerHTML='';ch.forEach(c=>{const box=document.createElement('div');box.className='dch';const st=document.createElement('div');st.className='strip';
    c.entries.forEach(e=>{if(e.t==='d'){const cc=document.createElement('canvas');cc.width=cc.height=160;renderStrokes(cc,JSON.parse(e.v));st.appendChild(cc)}else{const t=document.createElement('div');t.className='tx';t.textContent=(e.t==='p'?'💬 ':'🤔 ')+e.v;st.appendChild(t)}});
    box.appendChild(st);gb.appendChild(box)});
  }
 }catch(e){gb.innerHTML='<p>Could not load the gallery. Check your connection and try again.</p>'}
}
